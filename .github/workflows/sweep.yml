name: sweep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: build fixtures
        run: |
          python make_test_metadata.py
          python make_test_elf.py --bits 64
          python make_test_elf.py --bits 32
      - name: sweep
        run: python run_sweep.py
