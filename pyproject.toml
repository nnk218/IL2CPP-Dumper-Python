[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "il2cpp-dumper-python"
version = "1.0.0"
description = "Dump Unity IL2CPP games: extract methods/types/strings from libil2cpp.so + global-metadata.dat"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "nnk218" }]
keywords = ["il2cpp", "unity", "reverse-engineering", "dump", "android"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Disassemblers",
]

[project.scripts]
dump-game = "dumpers.dump_game:main"
dump-metadata = "dumpers.dump_metadata:main"
dump-memory = "dumpers.dump_memory:main"

[tool.setuptools]
py-modules = []
packages = ["dumpers", "tools", "tests"]
